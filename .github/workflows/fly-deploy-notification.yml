# Requires GitHub secret: FLY_API_TOKEN (same token as backend deploy).
name: Deploy notification to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "notification/**"
      - ".github/workflows/fly-deploy-notification.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy notification service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: ./.github/actions/install-flyctl

      - name: Deploy simdrive-pro-notification
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
