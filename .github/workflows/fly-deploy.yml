# Requires GitHub secret: FLY_API_TOKEN (Fly.io deploy token, same org for all apps).
# Create: fly tokens create deploy  OR  Fly dashboard → Access tokens
name: Deploy API to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install from GitHub releases (with retries) — avoids Fly CDN
      # /flyctl_releases/.../latest timeouts that break setup-flyctl@master.
      - name: Install flyctl
        uses: ./.github/actions/install-flyctl

      - name: Deploy simdrive-pro-api
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
