name: Deploy API to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install from GitHub releases (with retries) — avoids Fly CDN
      # /flyctl_releases/.../latest timeouts that break setup-flyctl@master.
      - name: Install flyctl
        working-directory: .
        env:
          FLYCTL_VERSION: "0.4.107"
        run: |
          set -euo pipefail
          url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 \
              -o /tmp/flyctl.tar.gz "$url"; then
              break
            fi
            echo "Download attempt ${attempt} failed"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          sudo tar -xzf /tmp/flyctl.tar.gz -C /usr/local/bin flyctl
          flyctl version

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
