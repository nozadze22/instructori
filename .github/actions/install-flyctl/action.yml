name: Install flyctl
description: Install flyctl CLI from GitHub releases (avoids Fly CDN timeouts)
runs:
  using: composite
  steps:
    - name: Download and install flyctl
      shell: bash
      env:
        FLYCTL_VERSION: "0.4.107"
      run: |
        set -euo pipefail
        url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
        for attempt in 1 2 3; do
          if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 \
            -o /tmp/flyctl.tar.gz "$url"; then
            break
          fi
          echo "Download attempt ${attempt} failed"
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
        sudo tar -xzf /tmp/flyctl.tar.gz -C /usr/local/bin flyctl
        flyctl version
