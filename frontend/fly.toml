app = "simdrive-pro-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    BACKEND_URL = "https://simdrive-pro-api.fly.dev"
    NEXT_PUBLIC_APP_URL = "https://simdrive-pro-web.fly.dev"
    NEXT_PUBLIC_API_URL = "https://simdrive-pro-api.fly.dev"
    NEXT_PUBLIC_GOOGLE_MAPS_API_KEY = "AIzaSyBBaRPn0koPQgnoXtwYE3ugR-8TJcCAx9c"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
