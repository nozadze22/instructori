app = "simdrive-pro-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "./node_modules/.bin/prisma migrate deploy"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "90s"
    interval = "60s"
    method = "GET"
    path = "/"
    timeout = "10s"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
